workflows:
  macos-m2-build:
    name: macOS Apple Silicon (M2) Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: "3.24.5"
      vars:
        MAC_RUST_VERSION: "1.81.0"
        FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
        CARGO_EXPAND_VERSION: "1.0.95"
        VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
        MACOSX_DEPLOYMENT_TARGET: "12.3"
        VCPKG_ROOT: "$CM_BUILD_DIR/vcpkg"
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/target
        - $CM_BUILD_DIR/vcpkg/installed
    scripts:
      - name: Initialize submodules
        script: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
      
      - name: Install system dependencies
        script: |
          brew install llvm create-dmg pkg-config
          
      - name: Install NASM
        script: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version
          
      - name: Setup Rust
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $MAC_RUST_VERSION
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin
          rustup component add rustfmt
          
      - name: Install Bridge Codegen Tools
        script: |
          source $HOME/.cargo/env
          cargo install cargo-expand --version $CARGO_EXPAND_VERSION --locked
          cargo install flutter_rust_bridge_codegen --version $FLUTTER_RUST_BRIDGE_VERSION --features "uuid" --locked
          
      - name: Setup vcpkg
        script: |
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          cd "$VCPKG_ROOT"
          git checkout $VCPKG_COMMIT_ID
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg install --x-install-root="$VCPKG_ROOT/installed"
          
      - name: Generate Flutter-Rust Bridge
        script: |
          source $HOME/.cargo/env
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          
      - name: Flutter prep and pub get
        script: |
          cd flutter
          python3 -c "
          with open('pubspec.yaml', 'r') as f: c = f.read()
          with open('pubspec.yaml', 'w') as f: f.write(c.replace('extended_text: 14.0.0', 'extended_text: 13.0.0'))
          "
          flutter pub get
          python3 -c "
          import os
          p = os.path.expandvars('$FLUTTER_ROOT/packages/flutter/lib/src/scheduler/binding.dart')
          try:
              with open(p, 'r') as f: c = f.read()
              with open(p, 'w') as f: f.write(c.replace('_setFramesEnabledState(false);', '//_setFramesEnabledState(false);'))
          except Exception: pass
          "
          
      - name: Apply codebase patches
        script: |
          MIN_VER="12.3"
          python3 -c "
          import sys
          def rp(f, o, n):
              try:
                  with open(f, 'r') as file: c = file.read()
                  with open(f, 'w') as file: file.write(c.replace(o, n))
              except Exception as e: print(f'Err in {f}: {e}')
          
          rp('build.py', 'MACOSX_DEPLOYMENT_TARGET=10.14', f'MACOSX_DEPLOYMENT_TARGET={MIN_VER}')
          rp('build.py', 'MACOSX_DEPLOYMENT_TARGET=10.15', f'MACOSX_DEPLOYMENT_TARGET={MIN_VER}')
          rp('flutter/macos/Podfile', \"platform :osx, '10.14'\", f\"platform :osx, '{MIN_VER}'\")
          rp('flutter/macos/Podfile', \"platform :osx, '10.15'\", f\"platform :osx, '{MIN_VER}'\")
          rp('Cargo.toml', 'osx_minimum_system_version = \"10.14\"', f'osx_minimum_system_version = \"{MIN_VER}\"')
          rp('Cargo.toml', 'osx_minimum_system_version = \"10.15\"', f'osx_minimum_system_version = \"{MIN_VER}\"')
          rp('flutter/macos/Runner.xcodeproj/project.pbxproj', 'MACOSX_DEPLOYMENT_TARGET = 10.14;', f'MACOSX_DEPLOYMENT_TARGET = {MIN_VER};')
          rp('flutter/macos/Runner.xcodeproj/project.pbxproj', 'MACOSX_DEPLOYMENT_TARGET = 10.15;', f'MACOSX_DEPLOYMENT_TARGET = {MIN_VER};')
          
          rp('libs/hbb_common/src/config.rs', 'self.get_string(key, \"original\", vec![\"adaptive\"])', 'self.get_string(key, \"adaptive\", vec![\"original\"])')
          rp('libs/hbb_common/src/config.rs', 'self.get_string(key, \"scrollauto\", vec![\"scrolledge\", \"scrollbar\"])', 'self.get_string(key, \"scrollbar\", vec![\"scrollauto\", \"scrolledge\"])')
          "
          
      - name: Build macOS App
        script: |
          source $HOME/.cargo/env
          export MACOSX_DEPLOYMENT_TARGET="12.3"
          python3 build.py --flutter --hwcodec --unix-file-copy-paste
          
      - name: Package into DMG
        script: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          python3 -c "
          import sys
          f = sys.argv[1]
          with open(f, 'r') as file: c = file.read()
          with open(f, 'w') as file: file.write(c.replace('MAXIMUM_UNMOUNTING_ATTEMPTS=3', 'MAXIMUM_UNMOUNTING_ATTEMPTS=7'))
          " "$CREATE_DMG"
          create-dmg \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            DigitalSolution-macOS-AppleSilicon-arm64.dmg \
            ./flutter/build/macos/Build/Products/Release/RustDesk.app || true
            
    artifacts:
      - "*.dmg"
