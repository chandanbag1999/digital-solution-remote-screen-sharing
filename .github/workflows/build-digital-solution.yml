name: Digital Solution Build

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_NDK_VERSION: "3.1.2"
  NDK_VERSION: "r28c"
  LLVM_VERSION: "15.0.6"

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1: Generate Flutter-Rust Bridge (required by all jobs)
  # ════════════════════════════════════════════════════════════
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust ${{ env.RUST_VERSION }} with rustfmt
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install Flutter 3.22.3 for bridge codegen
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: stable
          cache: true

      - name: Install bridge codegen tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen \
            --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} \
            --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate bridge files
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ════════════════════════════════════════════════════════════
  # JOB 2: Windows x64 (.exe installer)
  # ════════════════════════════════════════════════════════════
  build-windows:
    name: Windows x64 (.exe)
    needs: generate-bridge
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache env vars
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg at C:\vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x64-windows-static)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "=== $f ==="; cat "$f"; echo ""
            done
            exit 1
          fi

      - name: Persist VCPKG_ROOT to GITHUB_ENV
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Build Windows installer
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python3 .\build.py --portable --flutter --hwcodec --vram

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-solution-windows-x64
          path: |
            flutter/build/windows/x64/runner/Release/

  # ════════════════════════════════════════════════════════════
  # JOB 3: macOS Apple Silicon arm64 (M1/M2/M3)
  # ════════════════════════════════════════════════════════════
  build-macos-arm64:
    name: macOS arm64 (Apple Silicon)
    needs: generate-bridge
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust ${{ env.MAC_RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-14-arm64

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install system tools + NASM 2.x
        run: |
          brew install pkg-config create-dmg yasm
          # Brew installs NASM 3.x which breaks aom/ffmpeg - must use 2.x
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies for macOS arm64
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "=== $f ==="; cat "$f"; echo ""
            done
            exit 1
          fi

      - name: Persist VCPKG_ROOT to GITHUB_ENV
        run: echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Patch macOS deployment target to 12.3 (all 4 required files)
        run: |
          MIN_VER="12.3"
          # 1. build.py cargo command MACOSX_DEPLOYMENT_TARGET
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_VER}/" build.py
          # 2. CocoaPods Podfile
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_VER}'/" flutter/macos/Podfile
          # 3. Cargo.toml osx_minimum_system_version
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_VER}\"/" Cargo.toml
          # 4. Xcode project.pbxproj (CRITICAL - fixes desktop_multi_window error)
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_VER};/" \
            flutter/macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS arm64 app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Create DMG for Apple Silicon
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            DigitalSolution-AppleSilicon-arm64.dmg \
            ./flutter/build/macos/Build/Products/Release/RustDesk.app || true

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: digital-solution-macos-arm64-AppleSilicon
          path: "*.dmg"

  # ════════════════════════════════════════════════════════════
  # JOB 4: macOS Intel x86_64
  # ════════════════════════════════════════════════════════════
  build-macos-intel:
    name: macOS x86_64 (Intel Mac)
    needs: generate-bridge
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust ${{ env.MAC_RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: x86_64-apple-darwin
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-13-intel

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install system tools + NASM 2.x
        run: |
          brew install pkg-config create-dmg yasm
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies for macOS x64
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "=== $f ==="; cat "$f"; echo ""
            done
            exit 1
          fi

      - name: Persist VCPKG_ROOT to GITHUB_ENV
        run: echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Patch macOS deployment target to 12.3 (all 4 required files)
        run: |
          MIN_VER="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_VER}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_VER}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_VER}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_VER};/" \
            flutter/macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS Intel app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Create DMG for Intel Mac
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            DigitalSolution-Intel-x86_64.dmg \
            ./flutter/build/macos/Build/Products/Release/RustDesk.app || true

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: digital-solution-macos-intel-x86_64
          path: "*.dmg"

  # ════════════════════════════════════════════════════════════
  # JOB 5: Android arm64 APK
  # ════════════════════════════════════════════════════════════
  build-android:
    name: Android arm64 APK
    needs: generate-bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Install system dependencies BEFORE vcpkg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            nasm yasm \
            clang libclang-dev \
            libssl-dev pkg-config \
            openjdk-17-jdk-headless \
            ninja-build wget

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Setup NDK ${{ env.NDK_VERSION }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg at /opt/artifacts/vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies for Android arm64
        # Uses RustDesk's build_android_deps.sh which correctly passes
        # --triplet arm64-android and overlay-triplets from vcpkg-configuration.json
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "arm64-v8a"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "=== $f ==="; cat "$f"; echo ""
            done
            exit 1
          fi

      - name: Install Rust ${{ env.RUST_VERSION }} with rustfmt
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-arm64
          key: aarch64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter ${{ env.ANDROID_FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
          channel: stable

      - name: Build Rust library for Android arm64
        # Uses RustDesk's ndk_arm64.sh: cargo ndk --platform 21 --target aarch64-linux-android
        # build --locked --release --features flutter,hwcodec
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build Flutter APK (Android arm64)
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: digital-solution-android-arm64
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
