name: Digital Solution Build
on:
  workflow_dispatch:
env:
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_RUST_BRIDGE_VERSION: 1.80.1
  CARGO_EXPAND_VERSION: 1.0.95
  VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  CARGO_NDK_VERSION: 3.1.2
  NDK_VERSION: r28c
  LLVM_VERSION: 15.0.6
jobs:
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04
    steps:
    - name: Install system dependencies
      run: "sudo apt-get install ca-certificates -y\nsudo apt-get update -y\nsudo\
        \ apt-get install -y \\\n  clang cmake curl gcc git g++ \\\n  libclang-dev\
        \ libgtk-3-dev llvm-dev \\\n  nasm ninja-build pkg-config wget\n"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Rust ${{ env.RUST_VERSION }} with rustfmt
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: bridge-ubuntu-22.04
    - name: Install Flutter 3.22.3 for bridge codegen
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.22.3
        channel: stable
        cache: true
    - name: Install bridge codegen tools
      shell: bash
      run: "cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked\n\
        cargo install flutter_rust_bridge_codegen \\\n  --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION\
        \ }} \\\n  --features \"uuid\" --locked\n# extended_text 14 needs newer Dart;\
        \ downgrade for 3.22.3\nsed -i -e 's/extended_text: 14.0.0/extended_text:\
        \ 13.0.0/g' flutter/pubspec.yaml\npushd flutter && flutter pub get && popd\n"
    - name: Run flutter_rust_bridge_codegen
      run: "~/.cargo/bin/flutter_rust_bridge_codegen \\\n  --rust-input ./src/flutter_ffi.rs\
        \ \\\n  --dart-output ./flutter/lib/generated_bridge.dart \\\n  --c-output\
        \ ./flutter/macos/Runner/bridge_generated.h\ncp ./flutter/macos/Runner/bridge_generated.h\
        \ ./flutter/ios/Runner/bridge_generated.h\n"
    - name: Upload bridge artifact
      uses: actions/upload-artifact@v4
      with:
        name: bridge-artifact
        path: './src/bridge_generated.rs

          ./src/bridge_generated.io.rs

          ./flutter/lib/generated_bridge.dart

          ./flutter/lib/generated_bridge.freezed.dart

          ./flutter/macos/Runner/bridge_generated.h

          ./flutter/ios/Runner/bridge_generated.h

          '
  build-windows:
    name: Windows x64
    needs: generate-bridge
    runs-on: windows-2022
    steps:
    - name: Export GitHub Actions cache env vars
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install LLVM ${{ env.LLVM_VERSION }}
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        architecture: x64
    - name: Replace Flutter engine with RustDesk custom engine (x64)
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
        -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        $flutterRoot = (Get-Command flutter).Source | Split-Path -Parent | Split-Path
        -Parent

        $engineDir = "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release"

        if (-not (Test-Path $engineDir)) { New-Item -ItemType Directory -Force -Path
        $engineDir }

        mv -Force windows-x64-release\* $engineDir\

        '
    - name: Patch Flutter (dropdown menu fix for 3.24.5)
      shell: bash
      run: 'cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname
        $(dirname $(which flutter)))

        cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Install Rust ${{ env.RUST_VERSION }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: x86_64-pc-windows-msvc
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: windows-2022
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg at C:\vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies (x64-windows-static)
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      shell: bash
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet x64-windows-static\
        \ \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\"\
        \ -name \"*.log\" | while read -r f; do\n    echo \"=== $f ===\"; cat \"$f\"\
        ; echo \"\"\n  done\n  exit 1\nfi\n"
    - name: Persist VCPKG_ROOT to GITHUB_ENV
      shell: bash
      run: echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
    - name: Build Windows (skip-portable-pack, get folder first)
      env:
        VCPKG_ROOT: C:\vcpkg
      run: 'python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec
        --vram

        mv ./flutter/build/windows/x64/runner/Release ./rustdesk

        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
        -OutFile usbmmidd_v2.zip

        Expand-Archive usbmmidd_v2.zip -DestinationPath .

        Remove-Item -Path usbmmidd_v2\Win32 -Recurse

        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe",
        "usbmmidd_v2\usbmmidd.bat"

        mv -Force .\usbmmidd_v2 ./rustdesk

        '
    - name: Build self-extracting .exe installer
      shell: bash
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/DigitalSolution-windows-x64.exe

        '
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: digital-solution-windows-x64-exe
        path: ./SignOutput/DigitalSolution-windows-x64.exe
    if: false
        '
    - name: Create DMG (Apple Silicon)
      run: "CREATE_DMG=\"$(command -v create-dmg)\"\nCREATE_DMG=\"$(readlink -f \"\
        $CREATE_DMG\")\"\nsed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/'\
        \ \"$CREATE_DMG\"\ncreate-dmg \\\n  --icon \"RustDesk.app\" 200 190 \\\n \
        \ --hide-extension \"RustDesk.app\" \\\n  --window-size 800 400 \\\n  --app-drop-link\
        \ 600 185 \\\n  DigitalSolution-macOS-AppleSilicon-arm64.dmg \\\n  ./flutter/build/macos/Build/Products/Release/RustDesk.app\
        \ || true\n"
    - name: Upload macOS arm64 DMG
      uses: actions/upload-artifact@v4
      with:
        name: digital-solution-macos-AppleSilicon-arm64
        path: '*.dmg'
    if: false
  build-macos-intel:
    name: macOS Intel (x86_64 cross on M1)
    needs: generate-bridge
    runs-on: macos-14
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust ${{ env.MAC_RUST_VERSION }}
      run: |
        rustup toolchain install ${{ env.MAC_RUST_VERSION }}-x86_64-apple-darwin
        rustup default ${{ env.MAC_RUST_VERSION }}-x86_64-apple-darwin
        rustup component add rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: macos-13-intel
    - name: Install build runtime
      run: "brew install llvm create-dmg\nif command -v pkg-config &>/dev/null; then\n\
        \  echo \"pkg-config already installed\"\nelse\n  brew install pkg-config\n\
        fi\n"
    - name: Install NASM 2.16.03
      run: 'wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip

        unzip nasm-2.16.03-macosx.zip

        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

        nasm --version

        '
    - name: Install Flutter ${{ env.FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch Flutter (dropdown fix for 3.24.5)
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]] && git apply ${{ github.workspace
        }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Flutter workaround (scheduler binding issue
      shell: bash
      run: "cd \"$(dirname \"$(which flutter)\")\"\nsed -i -e 's/_setFramesEnabledState(false);/\\\
        /\\/_setFramesEnabledState(false);/g' \\\n  ../packages/flutter/lib/src/scheduler/binding.dart\n\
        grep -n '_setFramesEnabledState' ../packages/flutter/lib/src/scheduler/binding.dart\
        \ || true\n"
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_TRIPLET: x64-osx
        VCPKG_DEFAULT_HOST_TRIPLET: x64-osx
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"\
        ; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r f; do\n\
        \    echo \"=== $f ===\"; cat \"$f\"; echo \"\"\n  done\n  exit 1\nfi\n"
    - name: Persist VCPKG_ROOT to GITHUB_ENV
      run: echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
    - name: Patch macOS deployment target to 12.3 (all 4 files)
      run: "MIN_VER=\"12.3\"\nsed -i -e \"s/MACOSX_DEPLOYMENT_TARGET\\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_VER}/\"\
        \ build.py\nsed -i -e \"s/platform :osx, '.*'/platform :osx, '${MIN_VER}'/\"\
        \ flutter/macos/Podfile\nsed -i -e \"s/osx_minimum_system_version = \\\"[0-9]*.[0-9]*\\\
        \"/osx_minimum_system_version = \\\"${MIN_VER}\\\"/\" Cargo.toml\nsed -i -e\
        \ \"s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET =\
        \ ${MIN_VER};/\" \\\n  flutter/macos/Runner.xcodeproj/project.pbxproj\n\
        sed -i -e \"s/mac_arch = 'arm64' if platform.machine().lower() in ('arm64', 'aarch64') else 'x86_64'/mac_arch = 'x86_64'/g\" build.py\n"
    - name: Build macOS Intel
      env:
        MACOSX_DEPLOYMENT_TARGET: '12.3'
      run: './build.py --flutter --hwcodec --unix-file-copy-paste

        '
    - name: Create DMG (Intel)
      run: "CREATE_DMG=\"$(command -v create-dmg)\"\nCREATE_DMG=\"$(readlink -f \"\
        $CREATE_DMG\")\"\nsed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/'\
        \ \"$CREATE_DMG\"\ncreate-dmg \\\n  --icon \"RustDesk.app\" 200 190 \\\n \
        \ --hide-extension \"RustDesk.app\" \\\n  --window-size 800 400 \\\n  --app-drop-link\
        \ 600 185 \\\n  DigitalSolution-macOS-Intel-x86_64.dmg \\\n  ./flutter/build/macos/Build/Products/Release/RustDesk.app\
        \ || true\n"
    - name: Upload macOS Intel DMG
      uses: actions/upload-artifact@v4
      with:
        name: digital-solution-macos-Intel-x86_64
        path: '*.dmg'
  build-android:
    name: Android arm64 APK
    needs: generate-bridge
    runs-on: ubuntu-22.04
    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache env vars
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Install system dependencies (BEFORE vcpkg - nasm required for aom)
      run: "sudo apt-get update\nsudo apt-get install -y \\\n  clang cmake curl \\\
        \n  gcc-multilib g++ g++-multilib \\\n  libclang-dev \\\n  nasm yasm \\\n\
        \  ninja-build pkg-config \\\n  openjdk-17-jdk-headless \\\n  wget\n"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Setup NDK ${{ env.NDK_VERSION }}
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg at /opt/artifacts/vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies for Android arm64
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        VCPKG_ROOT: /opt/artifacts/vcpkg
      shell: bash
      run: "if ! ./flutter/build_android_deps.sh \"arm64-v8a\"; then\n  find \"${VCPKG_ROOT}/\"\
        \ -name \"*.log\" | while read -r f; do\n    echo \"=== $f ===\"; cat \"$f\"\
        ; echo \"\"\n  done\n  exit 1\nfi\n"
    - name: Install Rust ${{ env.RUST_VERSION }} with rustfmt
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: android-arm64
        key: aarch64-linux-android
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Flutter ${{ env.ANDROID_FLUTTER_VERSION }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
        channel: stable
    - name: Patch Flutter for Android (dropdown fix)
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == "${{ env.ANDROID_FLUTTER_VERSION }}" ]] && git apply ${{ github.workspace
        }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

        '
    - name: Build Rust library for Android arm64
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        VCPKG_ROOT: /opt/artifacts/vcpkg
      run: "rustup target add aarch64-linux-android\ncargo install cargo-ndk --version\
        \ ${{ env.CARGO_NDK_VERSION }} --locked\n./flutter/ndk_arm64.sh\nmkdir -p\
        \ ./flutter/android/app/src/main/jniLibs/arm64-v8a\ncp ./target/aarch64-linux-android/release/liblibrustdesk.so\
        \ \\\n   ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n"
    - name: Build Flutter APK
      run: 'cd flutter

        flutter pub get

        flutter build apk --release --target-platform android-arm64

        '
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: digital-solution-android-arm64-apk
        path: flutter/build/app/outputs/flutter-apk/app-release.apk
